# Deploys dist/ to GitHub Pages (free HTTPS, needed to install HokiePark on an iPhone).
# Manual trigger only, so it never runs (or fails) until someone enables Pages:
#   repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions", then Actions -> "Deploy to Pages" -> Run workflow.
# The app uses relative URLs, so it works from the /<repo>/ sub-path Pages serves it under.
name: Deploy to Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Public values only (project URL + anon key). Set them under Settings -> Secrets and variables -> Actions -> Variables.
      # If unset, the site builds with the bundled sample counts (feed off).
      - run: npm run build
        env:
          HOKIEPARK_SUPABASE_URL: ${{ vars.HOKIEPARK_SUPABASE_URL }}
          HOKIEPARK_SUPABASE_ANON_KEY: ${{ vars.HOKIEPARK_SUPABASE_ANON_KEY }}
          # Optional: set the Actions variable HOKIEPARK_ADVISOR=1 to turn on the Gemini advisor (needs the deployed `advisor` Edge Function).
          HOKIEPARK_ADVISOR: ${{ vars.HOKIEPARK_ADVISOR }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
